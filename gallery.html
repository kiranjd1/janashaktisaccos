<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Janashakti Saving and Credit Cooperative Society Ltd. -Birtamod Jhapa | Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">    
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
  <div id="preloader">
    <div class="spinner"></div>
  </div>

	<div id="header-container"></div>

	<main>
		<section class="gallery-section reveal">
			<div class="section-title">
					<h1>Gallery</h1>
					<p>Explore the glimpses captured during our numerous programmes and activities.</p>
			</div>
			<div class="gallery-nav">
					<button class="gallery-btn active" data-target="photos">Photos</button>
					<button class="gallery-btn" data-target="videos">Videos</button>
			</div>
			<div class="gallery-content">
				<div class="photos">
					<div class="photos-grid" id="gallery-events-grid"></div>
					<div id="event-photos-view" class="is-hidden">
						<div class="event-photos-header">
							<button type="button" id="event-photos-back" class="event-back-btn">
								<i class="fas fa-arrow-left"></i> Back to Events
							</button>
							<h2 id="event-photos-title"></h2>
						</div>
					<div id="event-photos-grid" class="event-photos-grid"></div>
				</div>
			</div>
			<div class="videos is-hidden">
				<div class="photos-grid">
					<a href="assets/pages/10th-agm-2081.html" class="thumbnail video">
						<div class="annual-general-meeting agm agm-10 2081">
								<img src="assets/thumbnails/agm-10-1.JPG" alt="Annual General Meeting Opening">
								<div class="thumbnail-title">
										<h3>10th Annual General Meeting 2081</h3>
								</div>                            
								<div class="view video">
										<i class="fas fa-play"></i>
										<span>Play Video</span>
								</div>
						</div>
					</a>
				</div>
			</div>
		</section>
	</main>

	<div id="footer-container"></div>

	<div id="gallery-photo-modal" class="modal-overlay" style="display: none;" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Photo viewer">
		<button type="button" id="gallery-photo-close" class="gallery-photo-close-btn" aria-label="Close photo viewer">&times;</button>
		<button type="button" id="gallery-photo-prev" class="gallery-viewer-nav prev" aria-label="Previous photo">
			<i class="fas fa-chevron-left"></i>
		</button>
		<img id="gallery-photo-image" src="" alt="Gallery preview image">
		<button type="button" id="gallery-photo-next" class="gallery-viewer-nav next" aria-label="Next photo">
			<i class="fas fa-chevron-right"></i>
		</button>
	</div>

	<script src="assets/js/script.js" defer></script>
	<script src="components/components.js"></script>
	<script src="assets/js/gallery.js"></script>
</body>
</html>
