<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Contact | Janashakti Saving and Credit Cooperative Society Ltd. -Birtamod Jhapa</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">    
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
  <div id="preloader">
    <div class="spinner"></div>
  </div>
  <div id="header-container"></div>
    
	<main>
		<section class="contact-section reveal">
			<div class="contact-details">
				<h1 data-en="Contact Us" data-ne="सम्पर्क गर्नुहोस्">Contact Us</h1>
				<p data-en="We'd love to hear from you! Please, reach out to us here." data-ne="हामी तपाईंबाट सुन्न चाहन्छौं!">We'd love to hear from you! Please, reach out to us here.</p>
				<p><i class="fas fa-map-marker-alt"></i>Bhadrapur Road, Birtamod-4, Jhapa, Nepal</p>
				<p><i class="fas fa-phone-alt"></i>+977-23-533344</p>
				<p><i class="fas fa-envelope"></i><a href="mailto:janashakticoop2014@gmail.com">janashakticoop2014@gmail.com</a></p>
				<p><i class="fas fa-clock"></i>Open Everyday: 10:00 AM - 5:00 PM</p>
				<div class=follow-us>
					<h2>Follow Us:</h2>
					<div class=social-media>
						<a href="https://www.facebook.com/jsaccosbirtamod" target="_blank" class="social-icon facebook" aria-label="Facebook"><i class="fab fa-facebook-f fa-fw"></i></a>
						<a href="https://www.twitter.com" target="_blank" class="social-icon twitter" aria-label="Twitter"><i class="fab fa-twitter fa-fw"></i></a>
						<a href="https://www.youtube.com/@JanashaktiSaccos" target="_blank" class="social-icon youtube" aria-label="YouTube"><i class="fab fa-youtube fa-fw"></i></a>
					</div>
				</div>
			</div>

			<div class="contact-form-section">
				<form class="contact-form" id="contactForm">
					<div class="form-group">
						<input type="text" id="firstName" name="firstName" placeholder=" " required>
						<label for="first_name" data-en="First Name" data-ne="नाम">First Name</label>
					</div>
					<div class="form-group">
						<input type="text" id="lastName" name="lastName" placeholder=" " required>
						<label for="last_name" data-en="Last Name" data-ne="थर">Last Name</label>
					</div>
					<div class="form-group">
						<input type="email" id="email" name="email" placeholder=" " required>
						<label for="email" data-en="Email" data-ne="इमेल">Email</label>
					</div>
					<div class="form-group">
            <input type="text" id="mobileNo" name="mobileNo" placeholder=" " required>
            <label for="number" data-en="Mobile Number" data-ne="मोबाइल नम्बर">Mobile Number</label>
          </div>
					<div class="form-group">
						<textarea id="message" name="message" rows="5" placeholder=" " required></textarea>
						<label for="message" data-en="Message" data-ne="सन्देश">Message</label>
					</div>
					<button type="submit" class="submit-btn" data-en="Submit" data-ne="पठाउनुहोस्">
						Submit
					</button>
				</form>
			</div>
		</section>
	</main>

	<div id="footer-container"></div>

	<script>
		document.getElementById('contactForm').addEventListener('submit', function(e) {
			e.preventDefault();

			const scriptURL = 'https://script.google.com/macros/s/AKfycbziQnr2Qys1Ofafr--kdEG4V16fAqMYO3d8cE2wSRJgaWdAO_eZ-rBMXk8yWKVAq5CnpQ/exec';

			const data = {
				firstName: document.getElementById('firstName').value,
				lastName: document.getElementById('lastName').value,
				email: document.getElementById('email').value,
				mobileNo: document.getElementById('mobileNo').value,
				message: document.getElementById('message').value
			};

			// Optional: You can still change the button text to "Submitting..." here if you want visual feedback before the popup appears

			fetch(scriptURL, {
				method: 'POST',
				mode: 'no-cors',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify(data)
			})
			.then(() => {
				alert('Thank you! Your message has been submitted. You will hear from us soon!');
				document.getElementById('contactForm').reset();
			})
			.catch(error => {
				alert('Error submitting message. Please try again.');
				console.error('Error!', error.message);
			});
		});
	</script>

	<script src="components/components.js" defer></script>
	<script src="assets/js/script.js" defer></script>

</body>
</html>
