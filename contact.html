			<div class="contact-form-section">

						<input type="text" id="first_name" name="first_name" placeholder=" " required>
						<label for="first_name" data-en="First Name" data-ne="नाम">First Name</label>

					<div class="form-group">
						<input type="text" id="last_name" name="last_name" placeholder=" " required>
						<label for="last_name" data-en="Last Name" data-ne="थर">Last Name</label>
					</div>
					<div class="form-group">
						<input type="email" id="email" name="email" placeholder=" " required>

					</div>
					<div class="form-group">

					</div>
					<button type="submit" class="submit-btn" data-en="Submit" data-ne="पठाउनुहोस्">

	<div id="footer-container"></div>

	<script>
		const contactForm = document.getElementById('contactForm');

		contactForm.addEventListener('submit', function(e) {
			e.preventDefault();

			// Get form values
			const formData = {
				first_name: document.getElementById('first_name').value,
				last_name: document.getElementById('last_name').value,
				email: document.getElementById('email').value,
				subject: document.getElementById('subject').value,
				message: document.getElementById('message').value
			};

			// Here you would typically send the data to your server
			// For now, we'll just log it to the console
			console.log('Form submitted:', formData);

			// Clear the form
			contactForm.reset();
			alert('Thank you for your message. We will get back to you soon!');
		});
	</script>
