<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News & Updates | Janashakti Saving and Credit Cooperative Society Ltd. -Birtamod Jhapa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
  <div id="preloader">
    <div class="spinner"></div>
  </div>

  <div id="header-container"></div>

  <main>
    <section class="notice-section reveal">
      <h2 class="section-title" data-en="News & Notices" data-ne="समाचार तथा सूचना">News & Notices</h2>
      <div class="updates-filter-bar" role="tablist" aria-label="Update category filters">
        <button class="updates-filter-btn active" type="button" data-filter="all" data-en="All" data-ne="सबै">All</button>
        <button class="updates-filter-btn" type="button" data-filter="news" data-en="News" data-ne="समाचार">News</button>
        <button class="updates-filter-btn" type="button" data-filter="notice" data-en="Notice" data-ne="सूचना">Notice</button>
      </div>
      <div class="updates-summary" id="updates-summary"></div>
      <div class="news-page-grid" id="updates-grid"></div>
			<div id="news-detail-view" style="display: none;">
        <button id="back-to-list-btn" class="back-btn">
          <i class="fas fa-arrow-left"></i> <span data-en="Back to News" data-ne="पछाडि जानुहोस्">Back to News</span>
        </button>
        <article class="news-detail-content">
          <header class="news-detail-header">
            <span class="updates-category-badge news" id="detail-category-badge">News</span>
            <div class="news-meta">
              <span><i class="fas fa-calendar-alt"></i></span>
              <span id="detail-date"></span>
            </div>
          </header>
          <h2 id="detail-title"></h2>
          <div id="detail-body" class="news-detail-body"></div>
          <div id="detail-gallery" class="news-detail-gallery"></div>
        </article>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <div id="updates-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content notice-modal-content">
      <button class="modal-close" id="updates-modal-close" aria-label="Close preview">&times;</button>
      <div class="modal-body notice-modal-body">
        <img id="updates-img-viewer" src="" alt="Update preview" style="display: none; max-width: 100%; max-height: 100%; object-fit: contain;">
        <embed id="updates-pdf-viewer" src="" type="application/pdf" style="display: none; width: 100%; height: 100%;">
      </div>
    </div>
  </div>

  <script src="components/components.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="assets/js/news.js" defer></script>
  <script src="assets/js/script.js" defer></script>
</body>
</html>
