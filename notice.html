<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notice | Janashakti Saving and Credit Cooperative Society Ltd. -Birtamod Jhapa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">    
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
	<div id="preloader">
		<div class="spinner"></div>
	</div>

	<div id="header-container"></div>

	<main>
		<section class="notice-section">
			<h2 class="section-title" data-en="News & Notices" data-ne="सुचना तथा समाचार">News & Notices</h2>
			<div class="notice-container" id="notice-container">
				<!-- Notices will be loaded here by JavaScript -->
			</div>
		</section>
	</main>

	<div id="footer-container"></div>

	<!-- Modal for viewing notice files -->
	<div id="notice-modal" class="modal-overlay" style="display: none;">
		<div class="modal-content notice-modal-content">
			<button class="modal-close" onclick="closeNoticeModal()">&times;</button>
			<div class="modal-body notice-modal-body">
				<img id="notice-img-viewer" src="" alt="Notice" style="display: none; max-width: 100%; max-height: 100%; object-fit: contain;">
				<embed id="notice-pdf-viewer" src="" type="application/pdf" style="display: none; width: 100%; height: 100%;">
			</div>
		</div>
	</div>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
	<script src="components/components.js" defer></script>
	<script src="assets/js/notices.js" defer></script>
	<script src="script.js" defer></script>
</body>
</html>
