<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Reports | Janashakti Saving and Credit Cooperative Society Ltd. -Birtamod Jhapa</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">    
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
  <div id="preloader">
    <div class="spinner"></div>
  </div>
  <div id="header-container"></div>

  <main class="main-reports">
		<section class="reports-section reveal">
			<h1 data-en="Official Reports" data-ne="आधिकारिक प्रतिवेदनहरु">Official Reports</h1>
			<p data-en="Explore our official reports, including monthly, quarterly and annual reports, to stay updated on our performance and activities." data-ne="हाम्राे कार्य र गतिविधिहरूमा अद्यावधिक रहनका लागि हाम्राे आधिकारिक प्रतिवेदनहरू अन्वेषण गर्नुहोस्।">Explore our official reports, including monthly, quarterly and annual reports, to stay updated on our performance and activities.</p>

			<div class="reports-category-tabs">
				<button class="report-tab active" data-category="monthly" data-en="Monthly Reports" data-ne="मासिक प्रतिवेदन">Monthly Reports</button>
				<button class="report-tab" data-category="quarterly" data-en="Quarterly Reports" data-ne="त्रैमासिक प्रतिवेदन">Quarterly Reports</button>
				<button class="report-tab" data-category="annual" data-en="Annual Reports" data-ne="वार्षिक प्रतिवेदन">Annual Reports</button>
			</div>

			<div class="reports-list" id="reports-container">
				<!-- Reports will be loaded here by JavaScript -->
			</div>
		</section>
  </main>

	<!-- Report Viewer Modal (image + PDF, like notice viewer) -->
	<div id="report-modal" class="modal-overlay" style="display: none;">
		<div class="modal-content report-modal-content">
			<button class="modal-close" id="report-modal-close">&times;</button>
			<div class="modal-body report-modal-body">
				<img id="report-img-viewer" src="" alt="Report" style="display: none; max-width: 100%; max-height: 100%; object-fit: contain;">
				<embed id="report-pdf-viewer" src="" type="application/pdf" style="display: none; width: 100%; height: 100%;">
			</div>
		</div>
	</div>

  <div id="footer-container"></div>
	<script src="components/components.js" defer></script>
	<script src="assets/js/reports.js" defer></script>
	<script src="assets/js/script.js" defer></script>

</body>
</html>
